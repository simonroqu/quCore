[package]
name = "qu-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Gemeinsamer Unterbau von AniQu, BoxQu und TubeQu (GTK4 + libmpv)"

[features]
# Fenster, Player, Seiten (GTK4 + libmpv). Ohne (`default-features = false`) bleibt der Teil ohne Oberfläche:
# app, config, progress, segments, store – z. B. für eine Android-App.
default = ["gui"]
gui = ["dep:async-channel", "dep:gtk4", "dep:libloading", "dep:libmpv2", "dep:libmpv2-sys", "dep:reqwest", "dep:serde_json"]

[dependencies]
async-channel = { version = "2", optional = true }
gtk4 = { version = "0.11", features = ["v4_20"], optional = true }
libloading = { version = "0.9.0", optional = true }
libmpv2 = { version = "7", optional = true }
libmpv2-sys = { version = "4", optional = true }
reqwest = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
toml = "0.9"
