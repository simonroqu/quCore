[package]
name = "qu-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Gemeinsamer Unterbau von AniQu, BoxQu und TubeQu (GTK4 + libmpv)"

[dependencies]
async-channel = "2"
gtk4 = { version = "0.11", features = ["v4_20"] }
libloading = "0.9.0"
libmpv2 = "7"
libmpv2-sys = "4"
reqwest = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
toml = "0.9"
