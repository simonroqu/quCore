[package]
name = "qu-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Gemeinsamer Unterbau von AniQu, BoxQu und Tubequ (GTK4 + libmpv)"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_20"] }
libmpv2 = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "0.9"
